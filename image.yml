# The manifest for docker-webtop (alpine-i3 branch). Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/image.schema.json
schema: 1
name: webtop

summary: |-
  [Webtop](https://github.com/linuxserver/docker-webtop) - Alpine, Ubuntu, Fedora, and Arch based containers containing full desktop environments in officially supported flavors accessible via any modern web browser.

upstream:
  url: https://github.com/linuxserver/docker-webtop
  version:
    type: os

release:
  branch: alpine-i3
  tag: alpine-i3
  channel: prerelease

build:
  base: selkies
  version_arg: I3_VERSION
  platforms:
  - amd64
  - arm64

test:
  startup_timeout: 120
  env:
    TZ: US/Pacific
  web:
    port: 3001
    scheme: https
    auth: user:password
    screenshot_delay: 30

runtime: {}

docs:
  categories:
  - Remote Desktop
  custom_readme: |
    Up to date documentation is available [here](https://github.com/linuxserver/docker-webtop/blob/master/README.md).

proxy:
  port: 3001
  scheme: https
  subdomain: true
  subfolder:
    supported: false
